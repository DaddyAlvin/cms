<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS Admin Panel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Public CMS Dashboard</h1>
        </header>

        <!-- Redigera / Lägg till Översättning Modal -->
        <div id="editModal" class="modal">
            <div class="modal-content">
                <h2>Redigera / Översätt Sida</h2>
                <form id="editPageForm">
                    <input type="hidden" id="editId">
                    <div class="form-group">
                        <label for="editSprak">Språk för innehållet</label>
                        <select id="editSprak" required></select>
                    </div>
                    <div class="form-group">
                        <label for="editTitle">Titel</label>
                        <input type="text" id="editTitle" required>
                    </div>
                    <div class="form-group">
                        <label for="editContent">Innehåll</label>
                        <textarea id="editContent" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="editStatus">Status</label>
                        <select id="editStatus">
                            <option value="published">Publicerad</option>
                            <option value="draft">Utkast</option>
                        </select>
                    </div>
                    <button type="submit">Spara Ändringar</button>
                    <button type="button" class="secondary" onclick="closeEditModal()">Avbryt</button>
                </form>
            </div>
        </div>

        <!-- Skapa Ny Sida -->
        <div class="card">
            <h2>Skapa ny sida</h2>
            <form id="createPageForm">
                <div class="form-group">
                    <label for="sprak">Språk</label>
                    <select id="sprak" required>
                        <option value="" disabled selected>Välj språk...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="title">Sidans Rubrik</label>
                    <input type="text" id="title" placeholder="Fyll i titel..." required>
                </div>
                <div class="form-group">
                    <label for="content">Innehåll</label>
                    <textarea id="content" placeholder="Skriv din text här..." required></textarea>
                </div>
                <div class="form-group">
                    <label for="status">Status</label>
                    <select id="status">
                        <option value="published">Publicerad</option>
                        <option value="draft">Utkast</option>
                    </select>
                </div>
                <button type="submit">Skapa Sida</button>
            </form>
        </div>

        <!-- Filtrering & Sökning -->
        <div class="card">
            <h2>Hämta & Filtrera Sidor</h2>
            <div class="controls">
                <select id="filterStatus" onchange="fetchPages()">
                    <option value="">Alla statusar</option>
                    <option value="published">Publicerad</option>
                    <option value="draft">Utkast</option>
                </select>
                <select id="filterSprak" onchange="fetchPages()">
                    <option value="">Alla språk</option>
                </select>
                <select id="filterMonth" onchange="fetchPages()">
                    <option value="">Månad...</option>
                    <option value="1">Januari</option>
                    <option value="2">Februari</option>
                    <option value="3">Mars</option>
                    <option value="4">April</option>
                    <option value="5">Maj</option>
                    <option value="6">Juni</option>
                    <option value="7">Juli</option>
                    <option value="8">Augusti</option>
                    <option value="9">September</option>
                    <option value="10">Oktober</option>
                    <option value="11">November</option>
                    <option value="12">December</option>
                </select>
                <input type="text" id="searchInput" placeholder="Sök..." style="width: 160px;">
                <button onclick="fetchPages()">Filtrera</button>
            </div>
            
            <div id="pagesList"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
